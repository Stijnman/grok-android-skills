name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: |
          if find . -type f -name '*.py' -not -path './.git/*' | grep -q .; then
            python - <<'PY'
          import pathlib, py_compile
          files = [p for p in pathlib.Path('.').rglob('*.py') if '.git' not in p.parts]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"compiled {len(files)} Python files")
          PY
          else
            echo "No Python sources; documentation-only validation applies."
          fi
      - name: Validate skill metadata
        run: |
          test -s README.md
          test -s SKILL.md
          grep -qiE 'description|purpose|skills?|usage|requirements' SKILL.md
      - name: Reject unresolved template placeholders
        run: |
          if grep -R -n -E '\[Brief description to be added\]|\[main purpose to be added\]|\[description\]|\[Feature [0-9]+\]' README.md SKILL.md 2>/dev/null; then
            echo "Unresolved template placeholders found"
            exit 1
          fi
      - name: Basic secret-pattern check
        run: |
          python - <<'PY'
          import pathlib, re
          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'ghp_[A-Za-z0-9]{30,}'),
              re.compile(r'github_pat_[A-Za-z0-9_]{30,}'),
          ]
          bad=[]
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try: text=p.read_text(errors='ignore')
              except OSError: continue
              if any(rx.search(text) for rx in patterns): bad.append(str(p))
          if bad: raise SystemExit("Potential committed secrets: " + ", ".join(bad))
          print("No high-confidence secret patterns found")
          PY
