# Pre-commit hooks configuration for competitor_researcher
# See https://pre-commit.com for more information
# Install with: pip install pre-commit && pre-commit install

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        
      # Ensure files end with a newline
      - id: end-of-file-fixer
        
      # Check for added large files
      - id: check-added-large-files
        args: ['--maxkb=1024']
        
      # Check YAML validity
      - id: check-yaml
        
      # Check for merge conflict markers
      - id: check-merge-conflict
        
      # Detect private keys
      - id: detect-private-key
        
      # Check JSON validity
      - id: check-json
        
      # Pretty format JSON
      - id: pretty-format-json
        args: ['--autofix', '--indent=2', '--no-ensure-ascii']

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.8.1
    hooks:
      - id: markdownlint-cli2
        args: [--config, .markdownlint.json, --fix]
        exclude: CHANGELOG.md

  # Code formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        types: [markdown, yaml, json]
        args: [--write]

  # Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        args: 
          - --skip .git,*.json,*.yml,*.yaml,CHANGELOG.md,node_modules
          - --ignore-words-list competitor,researcher,gemini,typescript,react,express,api,AI,http,https
          - --check-filenames
          - --check-hidden

  # Security checks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: .git/

  # TypeScript/JS linting (if available)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        types: [javascript, typescript, tsx]
        args: [--fix, --ext, .ts,.tsx,.js,.jsx]

  # TypeScript type checking
  - repo: local
    hooks:
      - id: typescript-check
        name: TypeScript type check
        entry: npx tsc --noEmit
        language: system
        types: [typescript, tsx]
        pass_filenames: false
